# Structure of this playbook: entry types, fields, statuses and links.
# `playbook check` reads this file. To add an entry type, a field or a link,
# change the schema, not the checker.
#
# Every status value belongs to a category:
# - valid: it applies;
# - provisional: in preparation, it does not apply yet;
# - retired: it no longer applies.
# No entry links to a retired entry; a valid entry does not link to a
# provisional one.

# An entry is named by its file: rules/customer-data.md is customer-data, and
# the name is unique across the playbook. Links are names or Obsidian wikilinks
# ("[[customer-data]]"). A code inherited from a previous system goes in the
# entry's `aliases`: a link through it resolves, with a warning.

# Optional: entries that still live elsewhere, for example during a migration.
# One "name<tab>status<tab>type" per line. Links to them are warnings, not
# errors.
# pending: migration/pending.tsv

types:
  rule:
    folder: rules
    required: [applies]
    fields:
      applies: [everywhere, where-cited]
    status:
      field: status
      values: { in-force: valid, draft: provisional, superseded: retired }
    links:
      rules: rule
      processes: process
      procedures: procedure
      tools: tool

  process:
    folder: processes
    required: [owner]
    status:
      field: status
      values: { in-force: valid, draft: provisional, superseded: retired }
    links:
      procedures: procedure    # the procedures of the process, in order
      processes: process
      rules: rule
      tools: tool

  procedure:
    folder: procedures
    required: [owner]
    status:
      field: status
      values: { in-force: valid, draft: provisional, superseded: retired }
    links:
      procedures: procedure
      processes: process
      rules: rule
      tools: tool
      skills: skill

  tool:
    folder: tools
    required: [name]
    status:
      field: status
      values: { active: valid, trial: provisional, dismissed: retired }
    links:
      rules: rule

  skill:
    folder: skills
    file: SKILL.md             # skills/<name>/SKILL.md, Agent Skills format
    name: name                 # «name» matches the folder name
    required: [description]
    status:
      field: metadata.status
      values: { in-force: valid, trial: provisional, draft: provisional, superseded: retired }
    links:
      metadata.rules: rule
