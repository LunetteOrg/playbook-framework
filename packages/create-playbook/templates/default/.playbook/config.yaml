# Values the playbook's skills read. Skills are never edited to fit a company:
# what is particular to it goes here.

# The company this playbook belongs to.
company: {{name}}

# Who is responsible for what: the values entries use in `owner` and in their
# text. `decides` says what the role approves.
roles: []
#  - id: owner
#    name: the owner
#    internal: true
#    decides: prices, contracts, entries in force
#  - id: freelancer
#    name: a freelancer working on a client
#    internal: false
#    decides: the offer for their own part of the work

# Kinds of work an operator does: they shape an answer, not who decides.
competences: []
#  - id: development
#    name: development

# Where the company keeps each person's record (roles, competences, clients),
# and how to find a person in it. The records are company data, not here.
people:
  where: ""        # e.g. the People database of the workspace tool, or a folder
  match: email

# Brands the company publishes under (apply-design-system).
brands: []
#  - id: example
#    name: Example Ltd
#    covers: proposals, contracts, reports, slides and posts of the company
#    design-system: https://example.com/design-system   # the original: a URL or a path
#    copies: dated exports in the shared drive, Brand folder # read when the original cannot be reached
#    default: true
#  - id: founder
#    name: The founder as a person
#    design-system: none
#    note: the personal brand has its own identity, outside the company's design system

# Where a client's design system lives (apply-design-system).
clients:
  design-system: the client's shared folder

# Settings of each shared skill.
skills:
  apply-design-system:
    rules: []   # wikilinks to the rules content must meet before delivery (notes, formats, names)
